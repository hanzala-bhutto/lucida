[package]
name = "lucida"
version = "0.2.0"
description = "Lucida — an AI-enhanced smart whiteboard (Tauri shell)."
license = "MIT"
repository = "https://github.com/hanzala-bhutto/lucida"
authors = ["Hanzala Bhutto", "Julian Lang"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This is an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lucida_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native"] }

